# Notifications & Alerts System
# Telegram Bot integration for CI/CD events, failures, and deployments

name: "📢 Telegram Notifications"

on:
  workflow_run:
    workflows:
      - "CI/CD Pipeline"
      - "Go Extended CI"
      - "🔍 CodeQL Advanced Security"
      - "🛡️ Security Pipeline"
      - "🔒 Security Dependency Review"
    types:
      - completed
      - requested  # For manual workflow runs
  schedule:
    # Daily status report at 8 AM UTC
    - cron: '0 8 * * *'

permissions:
  contents: read
  pull-requests: read
  actions: read

jobs:
  notify:
    name: 'Send Notifications'
    runs-on: ubuntu-latest
    if: always()
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.GH_NOTIFY_TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.GH_NOTIFY_TELEGRAM_CHAT_ID }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Generate notification message
        id: notification
        env:
          WORKFLOW_NAME: ${{ github.event.workflow_run.name }}
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.event.workflow_run.head_branch || github.ref_name }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          ACTOR: ${{ github.event.workflow_run.triggering_actor.login }}
        run: |
          # Определяем тип уведомления и содержимое
          REPO_URL="https://github.com/$REPO"

          # Устанавливаем эмодзи и текст статуса
          case $CONCLUSION in
            "success")
              STATUS_EMOJI="✅"
              STATUS_TEXT="УСПЕХ"
              ;;
            "failure")
              STATUS_EMOJI="❌"
              STATUS_TEXT="НЕУДАЧА"
              ;;
            "cancelled")
              STATUS_EMOJI="⚠️"
              STATUS_TEXT="ОТМЕНЕНО"
              ;;
            *)
              STATUS_EMOJI="❓"
              STATUS_TEXT="$CONCLUSION"
              ;;
          esac

          # Создаем сообщение Telegram с форматированием MarkdownV2
          # Сначала экранируем переменные, содержащие специальные символы
          ESCAPED_WORKFLOW_NAME=$(echo "$WORKFLOW_NAME" | sed 's/[_*[\]()~`>#+-=|{}.!]/\\&/g')
          ESCAPED_REPO=$(echo "$REPO" | sed 's/[_*[\]()~`>#+-=|{}.!]/\\&/g')
          ESCAPED_BRANCH=$(echo "$BRANCH" | sed 's/[_*[\]()~`>#+-=|{}.!]/\\&/g')
          ESCAPED_ACTOR=$(echo "$ACTOR" | sed 's/[_*[\]()~`>#+-=|{}.!]/\\&/g')

          # Создаем части сообщения отдельно для избежания проблем с YAML
          LINE1="$STATUS_EMOJI *CI/CD $STATUS_TEXT*"
          LINE2="🏗️ *Рабочий процесс:* \`$ESCAPED_WORKFLOW_NAME\`"
          LINE3="📦 *Репозиторий:* [$ESCAPED_REPO](https://github.com/$REPO)"
          LINE4="🌿 *Ветка:* \`$ESCAPED_BRANCH\`"
          LINE5="👤 *Запущено:* \`$ESCAPED_ACTOR\`"
          LINE6="🔗 *Подробности:* [Посмотреть запуск](https://github.com/$REPO/actions/runs/$RUN_ID)"
          LINE7="🕐 $(date '+%Y-%m-%d %H:%M:%S UTC')"

          # Combine into final message using printf
          TELEGRAM_MESSAGE=$(printf '%s\n\n%s\n%s\n%s\n%s\n%s\n\n%s' \
            "$LINE1" \
            "$LINE2" \
            "$LINE3" \
            "$LINE4" \
            "$LINE5" \
            "$LINE6" \
            "$LINE7")

          echo "telegram_message<<EOF" >> $GITHUB_OUTPUT
          echo "$TELEGRAM_MESSAGE" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
          echo "status=$STATUS_TEXT" >> $GITHUB_OUTPUT
          echo "workflow=$WORKFLOW_NAME" >> $GITHUB_OUTPUT

      - name: Send Telegram notification
        run: |
          # Send message to Telegram bot only if credentials are set
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "Telegram credentials not set, skipping notification"
            exit 0
          fi
          
          # Create JSON payload with proper escaping
          JSON_PAYLOAD=$(cat <<EOF
          {
            "chat_id": "$TELEGRAM_CHAT_ID",
            "text": "${{ steps.notification.outputs.telegram_message }}",
            "parse_mode": "MarkdownV2",
            "disable_web_page_preview": true
          }
          EOF
          )

          curl -X POST "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/sendMessage" \
            -H 'Content-Type: application/json' \
            -d "$JSON_PAYLOAD"

      - name: Log failure details
        if: github.event.workflow_run.conclusion == 'failure'
        run: |
          echo "Workflow failed: ${{ github.event.workflow_run.name }}"
          echo "See: https://github.com/${{ github.repository }}/actions/runs/${{ github.event.workflow_run.id }}"

  # Daily status report
  daily-report:
    name: 'Daily Status Report'
    runs-on: ubuntu-latest
    if: github.event.schedule == '0 8 * * *'
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.GH_NOTIFY_TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.GH_NOTIFY_TELEGRAM_CHAT_ID }}
    steps:
      - name: Generate daily report
        run: |
          # Получаем статистику запусков рабочих процессов за последние 24 часа
          echo "## 📊 Ежедневный отчет статуса CI/CD" >> $GITHUB_STEP_SUMMARY
          echo "**Дата:** $(date -u '+%Y-%m-%d')" >> $GITHUB_STEP_SUMMARY
          echo "**Репозиторий:** ${{ github.repository }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # Это упрощенный отчет - в production вы бы запрашивали GitHub API
          echo "### 🔄 Недавние запуски рабочих процессов" >> $GITHUB_STEP_SUMMARY
          echo "- **Основная ветка:** проверить недавние запуски во вкладке Actions" >> $GITHUB_STEP_SUMMARY
          echo "- **Сканирование безопасности:** CodeQL, SAST, сканирование контейнеров" >> $GITHUB_STEP_SUMMARY
          echo "- **Обновления зависимостей:** Dependabot PRs" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          echo "### 📈 Метрики здоровья" >> $GITHUB_STEP_SUMMARY
          echo "- **Успешность сборки:** мониторить через Actions" >> $GITHUB_STEP_SUMMARY
          echo "- **Покрытие тестами:** проверить отчеты codecov" >> $GITHUB_STEP_SUMMARY
          echo "- **Проблемы безопасности:** проверить вкладку Security" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          echo "### 🎯 Рекомендации" >> $GITHUB_STEP_SUMMARY
          echo "- Проверить неудачные рабочие процессы" >> $GITHUB_STEP_SUMMARY
          echo "- Проверить предупреждения безопасности" >> $GITHUB_STEP_SUMMARY
          echo "- Проверить PRs от Dependabot" >> $GITHUB_STEP_SUMMARY

      - name: Отправить ежедневный отчет в Telegram
        run: |
          # Send daily report only if credentials are set
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "Telegram credentials not set, skipping daily report"
            exit 0
          fi
          
          # Создаем ежедневное сообщение отчета с правильным экранированием
          REPO_NAME="${{ github.repository }}"
          ESCAPED_REPO=$(echo "$REPO_NAME" | sed 's/[_*[\]()~`>#+-=|{}.!]/\\&/g')

          # Создаем части сообщения отчета отдельно
          REPORT_LINE1="📊 *Ежедневный отчет CI/CD*"
          REPORT_LINE2="📅 $(date -u '+%Y-%m-%d')"
          REPORT_LINE3=""
          REPORT_LINE4="*Репозиторий:* $ESCAPED_REPO"
          REPORT_LINE5=""
          REPORT_LINE6="🔄 *Недавние запуски рабочих процессов:*"
          REPORT_LINE7="• Основная ветка: проверить вкладку Actions"
          REPORT_LINE8="• Сканирование безопасности: CodeQL, SAST, Container"
          REPORT_LINE9="• Обновления зависимостей: Dependabot PRs"
          REPORT_LINE10=""
          REPORT_LINE11="📈 *Метрики здоровья:*"
          REPORT_LINE12="• Успешность сборки: мониторить через Actions"
          REPORT_LINE13="• Покрытие тестами: проверить отчеты Codecov"
          REPORT_LINE14="• Проблемы безопасности: проверить вкладку Security"
          REPORT_LINE15=""
          REPORT_LINE16="🎯 *Рекомендации:*"
          REPORT_LINE17="• Проверить неудачные рабочие процессы"
          REPORT_LINE18="• Проверить предупреждения безопасности"
          REPORT_LINE19="• Проверить PRs от Dependabot"
          REPORT_LINE20=""
          REPORT_LINE21="🔗 [Посмотреть отчет](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})"

          # Combine into final report message using printf
          REPORT_MESSAGE=$(printf '%s\n%s\n\n%s\n\n%s\n%s\n%s\n%s\n\n%s\n%s\n%s\n%s\n\n%s\n%s\n%s\n%s\n\n%s' \
            "$REPORT_LINE1" \
            "$REPORT_LINE2" \
            "$REPORT_LINE4" \
            "$REPORT_LINE6" \
            "$REPORT_LINE7" \
            "$REPORT_LINE8" \
            "$REPORT_LINE9" \
            "$REPORT_LINE11" \
            "$REPORT_LINE12" \
            "$REPORT_LINE13" \
            "$REPORT_LINE14" \
            "$REPORT_LINE16" \
            "$REPORT_LINE17" \
            "$REPORT_LINE18" \
            "$REPORT_LINE19" \
            "$REPORT_LINE21")

          # Send to Telegram
          curl -X POST "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/sendMessage" \
            -H 'Content-Type: application/json' \
            -d "{
              \"chat_id\": \"$TELEGRAM_CHAT_ID\",
              \"text\": \"$REPORT_MESSAGE\",
              \"parse_mode\": \"MarkdownV2\",
              \"disable_web_page_preview\": true
            }"
